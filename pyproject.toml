[project]
name = "rf-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hermann Pommerenke", email = "dev@pommerenke.ch" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "tqdm>=4.70.1",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.pytest.ini_options]
# any unexpected warning (e.g. `AccuracyWarning` from too coarse sampling) fails the test
filterwarnings = ["error"]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
    "scipy-stubs>=1.18.1.1",
    "types-tqdm>=4.70.0.20260906",
]
